    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzz4EBdQhG_8YQv86xKE5HMJWLnKbKHDztycg0JAEvvsGykwkAtj_7-qq8CLa1maGII/exec";
        
        let baseEstoqueCache = []; 

        function simularLogin() {
            document.getElementById('tela-login').classList.remove('active');
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('app-conteudo').classList.remove('hidden');
            carregarDadosEstoque(); 
        }

        async function carregarDadosEstoque() {
            const tbody = document.getElementById('tabela-estoque-body');
            const datalist = document.getElementById('lista-materiais');
            tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-400"><i class="ph ph-spinner animate-spin text-3xl mb-2 text-samuazul"></i><br>Sincronizando com o Google Sheets...</td></tr>';

            try {
                const response = await fetch(API_URL + "?acao=ler_estoque");
                const text = await response.text(); 
                
                try {
                    const result = JSON.parse(text); 
                    if (result.status === "success") {
                        baseEstoqueCache = result.data;
                        renderizarTabela(baseEstoqueCache);
                        datalist.innerHTML = '';
                        baseEstoqueCache.forEach(item => {
                            if (item.MATERIAL) {
                                const option = document.createElement('option');
                                option.value = item.MATERIAL;
                                datalist.appendChild(option);
                            }
                        });
                    } else {
                        tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500 font-bold"><i class="ph ph-warning-circle text-2xl mb-2"></i><br>Erro da Planilha: ${result.mensagem}</td></tr>`;
                    }
                } catch (e) {
                    console.error("API retornou HTML (Bloqueio do Google):", text);
                    tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500 font-bold bg-red-50 rounded-lg"><i class="ph ph-lock-key text-3xl mb-2"></i><br>Bloqueio de Segurança do Google.<br><span class="text-sm font-normal text-gray-600 mt-2 block">Por favor, refaça o PASSO 1 gerando uma "Nova Implantação" com permissão para "Qualquer Pessoa".</span></td></tr>`;
                }
            } catch (error) {
                console.error("Erro no fetch:", error);
                tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-red-500 font-bold"><i class="ph ph-wifi-x text-2xl mb-2"></i><br>Falha na Rede ou CORS.</td></tr>';
            }
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabela-estoque-body');
            tbody.innerHTML = '';

            if (dados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-400">Nenhum material encontrado na planilha.</td></tr>';
                return;
            }

            dados.forEach(item => {
                const qtd = Number(item.QUANTIDADE_ATUAL) || 0;
                const min = Number(item.ESTOQUE_MINIMO) || 5;
                const alertaBaixo = qtd <= min;

                const statusHtml = alertaBaixo 
                    ? `<span class="inline-flex items-center gap-1.5 bg-red-50 text-red-600 border border-red-200/60 px-3 py-1 rounded-full text-xs font-semibold"><i class="ph-fill ph-warning-circle"></i> Baixo</span>`
                    : `<span class="inline-flex items-center gap-1.5 bg-green-50 text-green-700 border border-green-200/60 px-3 py-1 rounded-full text-xs font-semibold"><i class="ph-fill ph-check-circle"></i> Estoque OK</span>`;

                const trClass = alertaBaixo ? "bg-red-50/20 hover:bg-red-50/40" : "hover:bg-gray-50/80";
                const qtdColor = alertaBaixo ? "text-red-600" : "text-samunavy";

                const tr = document.createElement('tr');
                tr.className = `${trClass} transition group`;
                tr.innerHTML = `
                    <td class="p-4 font-medium text-gray-900 uppercase text-xs tracking-wide">${item.MATERIAL || '-'}</td>
                    <td class="p-4 text-gray-500">${item.UNIDADE_MEDIDA || '-'}</td>
                    <td class="p-4 text-center font-bold text-lg ${qtdColor}">${qtd}</td>
                    <td class="p-4 text-right pr-6">${statusHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarTabela(texto) {
            const pesquisa = texto.toLowerCase();
            const dadosFiltrados = baseEstoqueCache.filter(item => {
                const materialStr = (item.MATERIAL || "").toLowerCase();
                return materialStr.includes(pesquisa);
            });
            renderizarTabela(dadosFiltrados);
        }

        function preencherHoraAtual() {
            const agora = new Date();
            agora.setMinutes(agora.getMinutes() - agora.getTimezoneOffset());
            const dataFormatada = agora.toISOString().slice(0, 16);
            document.getElementById('data-retirada').value = dataFormatada;
            document.getElementById('data-entrada').value = dataFormatada;
        }

        function navegar(alvo) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + alvo).classList.add('active');
            window.scrollTo(0, 0);

            if (alvo === 'retirada' || alvo === 'entrada') {
                preencherHoraAtual();
            }
        }

        function sair() {
            document.getElementById('app-conteudo').classList.add('hidden');
            document.getElementById('tela-login').classList.remove('hidden');
            document.getElementById('tela-login').classList.add('active');
        }
    </script>
</body>
</html>
