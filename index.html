<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Estoque Sala 21 - SAMU</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Auth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        samuazul: '#0160A4',
                        samunavy: '#002D66',
                        samuclaro: '#B9CDDB',
                        samublue: '#F0F6FB'
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                } 
            } 
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        .linha-degrade-grossa { border-bottom: 3px solid transparent; border-image: linear-gradient(to right, #002D66, #0160A4, #B9CDDB) 1; }
        body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%); }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        table { border-collapse: separate; border-spacing: 0; }
        input, select { transition: all 0.2s ease; }
    </style>
</head>
<body class="min-h-screen font-sans text-gray-800 text-sm">
    
    <!-- TELA DE LOGIN -->
    <div id="tela-login" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center px-6 text-center active">
        <div class="w-20 h-20 mb-4">
            <img src="logo-samu.jpg" alt="Logo SAMU" class="w-full h-full object-contain">
        </div>
        <h1 class="text-2xl font-bold text-samunavy mb-2 tracking-tight">SAMU - MOGI DAS CRUZES</h1>
        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em] mb-8">Controle de Estoque • Sala 21</p>
        
        <button onclick="simularLogin()" class="bg-white border border-gray-200 shadow-sm px-6 py-3 rounded-lg flex items-center gap-3 hover:bg-gray-50 hover:border-gray-300 text-gray-700 font-medium text-sm transition duration-200">
            <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Entrar com Google
        </button>
    </div>

    <!-- APLICAÇÃO PRINCIPAL -->
    <div id="app-conteudo" class="hidden flex flex-col min-h-screen">
        
        <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-40 linha-degrade-grossa border-b border-gray-100">
            <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">
                <div class="flex items-center gap-4 cursor-pointer group" onclick="navegar('home')">
                    <div class="w-10 h-10 flex items-center justify-center group-hover:opacity-80 transition">
                        <img src="logo-samu.jpg" alt="Logo SAMU" class="w-full h-full object-contain">
                    </div>
                    <div>
                        <h1 class="text-base font-bold leading-tight tracking-wide text-samunavy">SAMU MOGI</h1>
                        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mt-0.5">Estoque Sala 21</p>
                    </div>
                </div>
                <div class="flex items-center gap-6">
                    <span class="text-sm text-gray-700 font-medium flex items-center gap-2"><i class="ph ph-user-circle text-lg text-samuazul"></i> Administrador</span>
                    <button onclick="sair()" class="text-gray-500 hover:text-red-500 transition flex items-center gap-1.5 text-sm font-medium">
                        <i class="ph ph-sign-out text-base"></i> Sair
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-6 py-8 w-full flex-grow">
            
            <!-- VIEW: HOME -->
            <section id="view-home" class="view-section active">
                <div class="grid grid-cols-4 gap-6 pt-2">
                    <button onclick="navegar('estoque')" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-4 hover:shadow-md hover:border-samuazul/30 transition-all duration-300 group">
                        <div class="w-14 h-14 rounded-full bg-blue-50/50 text-samuazul flex items-center justify-center text-3xl group-hover:scale-110 transition-transform duration-300">
                            <i class="ph ph-package"></i>
                        </div>
                        <span class="font-semibold text-gray-700 text-base group-hover:text-samunavy">Estoque</span>
                    </button>
                    <button onclick="navegar('retirada')" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-4 hover:shadow-md hover:border-red-300/50 transition-all duration-300 group">
                        <div class="w-14 h-14 rounded-full bg-red-50/50 text-red-500 flex items-center justify-center text-3xl group-hover:scale-110 transition-transform duration-300">
                            <i class="ph ph-upload-simple"></i>
                        </div>
                        <span class="font-semibold text-gray-700 text-base group-hover:text-red-600">Retirada</span>
                    </button>
                    <button onclick="navegar('entrada')" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-4 hover:shadow-md hover:border-green-300/50 transition-all duration-300 group">
                        <div class="w-14 h-14 rounded-full bg-green-50/50 text-green-600 flex items-center justify-center text-3xl group-hover:scale-110 transition-transform duration-300">
                            <i class="ph ph-download-simple"></i>
                        </div>
                        <span class="font-semibold text-gray-700 text-base group-hover:text-green-700">Entrada</span>
                    </button>
                    <button onclick="navegar('relatorios')" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-4 hover:shadow-md hover:border-purple-300/50 transition-all duration-300 group">
                        <div class="w-14 h-14 rounded-full bg-purple-50/50 text-purple-600 flex items-center justify-center text-3xl group-hover:scale-110 transition-transform duration-300">
                            <i class="ph ph-chart-line-up"></i>
                        </div>
                        <span class="font-semibold text-gray-700 text-base group-hover:text-purple-700">Relatórios</span>
                    </button>
                </div>
            </section>

            <!-- VIEW: ESTOQUE -->
            <section id="view-estoque" class="view-section">
                
                <div class="flex justify-between items-end mb-5">
                    <div>
                        <button onclick="navegar('home')" class="text-gray-500 hover:text-samuazul flex items-center gap-1.5 mb-2 text-sm font-medium transition"><i class="ph ph-arrow-left text-base"></i> Voltar</button>
                        <h2 class="text-xl font-bold text-gray-800 tracking-tight">Estoque Atual</h2>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="carregarDadosEstoque()" class="bg-white border border-gray-200 text-gray-500 hover:text-samuazul hover:bg-blue-50 px-3 py-2.5 rounded-lg shadow-sm transition flex items-center gap-2" title="Atualizar Tabela">
                            <i class="ph ph-arrows-clockwise text-lg"></i>
                        </button>
                        
                        <!-- NOVO: Dropdown de Ordenação -->
                        <select id="sort-estoque" onchange="atualizarTabela()" class="bg-white border border-gray-200 text-gray-600 text-sm rounded-lg p-2.5 shadow-sm outline-none focus:border-samuazul/50 focus:ring-2 focus:ring-blue-50 cursor-pointer transition">
                            <option value="az">Ordem Alfabética (A-Z)</option>
                            <option value="za">Ordem Alfabética (Z-A)</option>
                            <option value="qtd-desc">Maior Quantidade</option>
                            <option value="qtd-asc">Menor Quantidade</option>
                            <option value="status">Itens em Baixa Primeiro</option>
                        </select>

                        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-2.5 flex items-center gap-2 w-[350px] focus-within:border-samuazul/50 focus-within:ring-2 focus-within:ring-blue-50 transition">
                            <i class="ph ph-magnifying-glass text-gray-400 text-lg ml-2"></i>
                            <input type="text" id="pesquisa-estoque" oninput="atualizarTabela()" placeholder="Pesquisar material..." class="w-full text-sm outline-none bg-transparent placeholder-gray-400 text-gray-700">
                        </div>
                    </div>
                </div>

                <!-- NOVO: Cards de Resumo (Preenche o espaço vazio e dá contexto) -->
                <div class="grid grid-cols-3 gap-6 mb-6">
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-blue-50 text-samuazul flex items-center justify-center text-2xl"><i class="ph ph-stack"></i></div>
                        <div>
                            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Total de Itens Cadastrados</p>
                            <p class="text-2xl font-black text-samunavy" id="metric-total">0</p>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-green-50 text-green-600 flex items-center justify-center text-2xl"><i class="ph ph-check-circle"></i></div>
                        <div>
                            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Itens com Estoque OK</p>
                            <p class="text-2xl font-black text-green-700" id="metric-ok">0</p>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-red-100/50 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-red-50 text-red-500 flex items-center justify-center text-2xl"><i class="ph ph-warning-circle"></i></div>
                        <div>
                            <p class="text-[10px] text-red-400 font-bold uppercase tracking-widest">Itens em Baixa</p>
                            <p class="text-2xl font-black text-red-600" id="metric-baixo">0</p>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[11px] text-gray-400 uppercase tracking-widest border-b border-gray-100 bg-gray-50/30">
                                <th class="py-3 px-6 font-semibold w-1/2">Material</th>
                                <th class="py-3 px-6 font-semibold w-1/4">Unidade</th>
                                <th class="py-3 px-6 font-semibold text-right pr-8 w-1/4">Quantidade</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-estoque-body" class="text-sm text-gray-700"></tbody>
                    </table>
                </div>
            </section>

            <!-- VIEW: RETIRADA -->
            <section id="view-retirada" class="view-section">
                <div class="mb-6">
                    <button onclick="navegar('home')" class="text-gray-500 hover:text-red-500 flex items-center gap-1.5 mb-2 text-sm font-medium transition"><i class="ph ph-arrow-left text-base"></i> Voltar</button>
                    <h2 class="text-xl font-bold text-gray-800 tracking-tight">Registro de Retirada</h2>
                </div>
                
                <form id="form-retirada" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100" onsubmit="enviarRetirada(event)">
                    <div class="grid grid-cols-3 gap-6 mb-6">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2">Data e Hora</label>
                            <input type="datetime-local" id="ret-data" class="w-full border border-gray-200 rounded-lg p-3 text-sm bg-gray-50 focus:bg-white focus:border-red-300 focus:ring-2 focus:ring-red-50 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2">Solicitante</label>
                            <input type="text" id="ret-solicitante" placeholder="Nome do colaborador" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:border-red-300 focus:ring-2 focus:ring-red-50 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2">Setor</label>
                            <select id="ret-setor" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:border-red-300 focus:ring-2 focus:ring-red-50 outline-none text-gray-700" required>
                                <option value="">Selecione o setor...</option>
                                <option>Diretoria</option>
                                <option>Adm</option>
                                <option>RH</option>
                                <option>NEP</option>
                                <option>Coordenação Médica</option>
                                <option>Regulação</option>
                                <option>Farmácia</option>
                                <option>SESMT</option>
                                <option>Frota</option>
                                <option>TI</option>
                                <option>CME</option>
                                <option>Coordenação de Enfermagem</option>
                                <option>Financeiro</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-12 gap-6 mb-6">
                        <div class="col-span-6">
                            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2">Material</label>
                            <div class="relative">
                                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                                <input list="lista-materiais" id="ret-material" placeholder="Procurar material..." class="w-full border border-gray-200 rounded-lg p-3 pl-10 text-sm focus:border-red-300 focus:ring-2 focus:ring-red-50 outline-none" required>
                            </div>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2">Qtd</label>
                            <input type="number" id="ret-qtd" min="1" placeholder="0" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:border-red-300 focus:ring-2 focus:ring-red-50 outline-none" required>
                        </div>
                        <div class="col-span-4">
                            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2">Observação</label>
                            <input type="text" id="ret-obs" placeholder="Opcional" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:border-red-300 focus:ring-2 focus:ring-red-50 outline-none">
                        </div>
                    </div>
                    
                    <div class="flex justify-end pt-5 border-t border-gray-100">
                        <button type="submit" id="btn-retirada" class="bg-gray-900 text-white font-medium text-sm py-3 px-6 rounded-lg hover:bg-gray-800 transition shadow-sm flex items-center gap-2">
                            <i class="ph ph-check-circle text-lg"></i> Finalizar Retirada
                        </button>
                    </div>
                </form>
            </section>

            <!-- VIEW: ENTRADA -->
            <section id="view-entrada" class="view-section">
                <div class="mb-6">
                    <button onclick="navegar('home')" class="text-gray-500 hover:text-green-600 flex items-center gap-1.5 mb-2 text-sm font-medium transition"><i class="ph ph-arrow-left text-base"></i> Voltar</button>
                    <h2 class="text-xl font-bold text-gray-800 tracking-tight">Entrada de Material</h2>
                </div>
                
                <form id="form-entrada" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100" onsubmit="enviarEntrada(event)">
                    <div class="grid grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2">Data e Hora</label>
                            <input type="datetime-local" id="ent-data" class="w-full border border-gray-200 rounded-lg p-3 text-sm bg-gray-50 focus:bg-white focus:border-green-300 focus:ring-2 focus
