    <script>
        // MANTENHA A SUA URL AQUI
        const API_URL = "https://script.google.com/macros/s/AKfycbzz4EBdQhG_8YQv86xKE5HMJWLnKbKHDztycg0JAEvvsGykwkAtj_7-qq8CLa1maGII/exec";
        
        let baseEstoqueCache = []; 

        function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

        function mostrarAviso(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('hidden');
            clearTimeout(window._toast);
            window._toast = setTimeout(() => t.classList.add('hidden'), 4000);
        }


        function simularLogin() {
            document.getElementById('tela-login').classList.remove('active');
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('app-conteudo').classList.remove('hidden');
            carregarDadosEstoque(); 
        }

        async function carregarDadosEstoque() {
            const tbody = document.getElementById('tabela-estoque-body');
            const datalist = document.getElementById('lista-materiais');
            tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-gray-400"><i class="ph ph-spinner animate-spin text-3xl mb-2 text-samuazul"></i><br>Sincronizando com o Google Sheets...</td></tr>';

            try {
                const response = await fetch(API_URL + "?acao=ler_estoque");
                const text = await response.text(); 
                
                try {
                    const result = JSON.parse(text); 
                    if (result.status === "success") {
                        baseEstoqueCache = result.data;
                        atualizarTabela(); 
                        
                        datalist.innerHTML = '';
                        baseEstoqueCache.forEach(item => {
                            if (item.MATERIAL) {
                                const option = document.createElement('option');
                                option.value = (item.MATERIAL || '').toLowerCase().replace(/(?:^|\s)\S/g, a => a.toUpperCase());
                                datalist.appendChild(option);
                            }
                        });
                    } else {
                        tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-red-500 font-bold"><i class="ph ph-warning-circle text-2xl mb-2"></i><br>Erro da Planilha: ${esc(result.mensagem)}</td></tr>`;
                    }
                } catch (e) {
                    tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-red-500 font-bold bg-red-50 rounded-lg"><i class="ph ph-lock-key text-3xl mb-2"></i><br>Bloqueio de Segurança do Google.<br><span class="text-sm font-normal text-gray-600 mt-2 block">Verifique se gerou uma "Nova Implantação" com permissão para "Qualquer Pessoa".</span></td></tr>`;
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-red-500 font-bold"><i class="ph ph-wifi-x text-2xl mb-2"></i><br>Falha na Rede ou CORS.</td></tr>';
            }
        }

        function atualizarTabela() {
            const texto = document.getElementById('pesquisa-estoque').value.toLowerCase();
            const criterio = document.getElementById('sort-estoque').value;

            let dadosManipulados = baseEstoqueCache.filter(item => {
                const materialStr = (item.MATERIAL || "").toLowerCase();
                return materialStr.includes(texto);
            });

            dadosManipulados.sort((a, b) => {
                const matA = (a.MATERIAL || "").toLowerCase();
                const matB = (b.MATERIAL || "").toLowerCase();
                const qtdA = Number(a.QUANTIDADE_ATUAL) || 0;
                const qtdB = Number(b.QUANTIDADE_ATUAL) || 0;

                if (criterio === 'az') return matA.localeCompare(matB);
                if (criterio === 'za') return matB.localeCompare(matA);
                if (criterio === 'qtd-desc') return qtdB - qtdA;
                if (criterio === 'qtd-asc') return qtdA - qtdB;
                return 0;
            });

            // Atualiza apenas a métrica de Total na barra
            document.getElementById('metric-total').innerText = baseEstoqueCache.length;

            renderizarTabela(dadosManipulados);
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabela-estoque-body');
            tbody.innerHTML = '';

            if (dados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-gray-400">Nenhum material encontrado.</td></tr>';
                return;
            }

            dados.forEach(item => {
                const qtd = Number(item.QUANTIDADE_ATUAL) || 0;
                const min = (item.ESTOQUE_MINIMO === '' || item.ESTOQUE_MINIMO == null) ? 5 : Number(item.ESTOQUE_MINIMO);
                const alertaBaixo = qtd <= min;

                const qtdColor = alertaBaixo ? "text-red-500 font-bold" : "text-gray-700 font-semibold";
                const nomeMaterial = (item.MATERIAL || '-').toLowerCase().replace(/(?:^|\s)\S/g, a => a.toUpperCase());

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/70 transition-colors border-b border-gray-50 last:border-0";
                
                tr.innerHTML = `
                    <td class="py-2.5 px-6 text-gray-800 font-medium">${esc(nomeMaterial)}</td>
                    <td class="py-2.5 px-6 text-gray-400 text-xs">${esc(item.UNIDADE_MEDIDA || '-')}</td>
                    <td class="py-2.5 px-6 text-right pr-8 text-base ${qtdColor}">${qtd}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        async function enviarRetirada(event) {
            event.preventDefault();
            const matDigitado = document.getElementById('ret-material').value.trim().toUpperCase();
            const itemEstoque = baseEstoqueCache.find(i => String(i.MATERIAL).trim().toUpperCase() === matDigitado);
            if (!itemEstoque) { alert('Material não encontrado no estoque. Escolha um item da lista.'); return; }
            const saldoAtual = Number(itemEstoque.QUANTIDADE_ATUAL) || 0;
            if (Number(document.getElementById('ret-qtd').value) > saldoAtual) { alert('Saldo insuficiente. Disponível: ' + saldoAtual); return; }
            const btn = document.getElementById('btn-retirada');
            const iconOriginal = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> Salvando...';
            btn.disabled = true;

            const payload = {
                acao: "retirada",
                data: document.getElementById('ret-data').value,
                solicitante: document.getElementById('ret-solicitante').value,
                setor: document.getElementById('ret-setor').value,
                material: document.getElementById('ret-material').value.toUpperCase(),
                qtd: document.getElementById('ret-qtd').value,
                obs: document.getElementById('ret-obs').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if(result.status === "success") {
                    document.getElementById('form-retirada').reset();
                    mostrarAviso('Retirada registrada • Protocolo ' + result.protocolo);
                    await carregarDadosEstoque(); 
                    navegar('estoque'); 
                } else {
                    alert("Erro na planilha: " + result.mensagem);
                }
            } catch (erro) {
                alert("Erro de conexão ao enviar a retirada.");
            } finally {
                btn.innerHTML = iconOriginal;
                btn.disabled = false;
            }
        }

        async function enviarEntrada(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-entrada');
            const iconOriginal = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> Adicionando...';
            btn.disabled = true;

            const payload = {
                acao: "entrada",
                data: document.getElementById('ent-data').value,
                fornecedor: document.getElementById('ent-fornecedor').value,
                material: document.getElementById('ent-material').value.toUpperCase(),
                qtd: document.getElementById('ent-qtd').value,
                obs: document.getElementById('ent-obs').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if(result.status === "success") {
                    document.getElementById('form-entrada').reset();
                    mostrarAviso('Entrada registrada • Protocolo ' + result.protocolo);
                    await carregarDadosEstoque();
                    navegar('estoque');
                } else {
                    alert("Erro na planilha: " + result.mensagem);
                }
            } catch (erro) {
                alert("Erro de conexão ao enviar a entrada.");
            } finally {
                btn.innerHTML = iconOriginal;
                btn.disabled = false;
            }
        }

        // ===== RELATÓRIOS =====
        let movimentosCache = null, relatorioAtual = [];

        function fmtData(v) {
            const d = new Date(v);
            return isNaN(d) ? String(v || '-') : d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
        }

        async function gerarRelatorio() {
            const btn = document.getElementById('btn-relatorio');
            const area = document.getElementById('rel-resultado');
            btn.disabled = true;
            area.innerHTML = '<p class="p-8 text-center text-gray-400">Carregando movimentações...</p>';
            try {
                const r = await fetch(API_URL + '?acao=ler_movimentos');
                const j = JSON.parse(await r.text());
                if (j.status !== 'success') throw new Error(j.mensagem || 'Erro desconhecido');
                movimentosCache = [
                    ...j.retiradas.map(m => ({ id: m.ID_RETIRADA, data: m.DATA, tipo: 'Retirada', pessoa: m.SOLICITANTE, setor: m.SETOR, material: m.MATERIAL, qtd: Number(m.QUANTIDADE) || 0, obs: m.OBSERVACAO })),
                    ...j.entradas.map(m => ({ id: m.ID_ENTRADA, data: m.DATA, tipo: 'Entrada', pessoa: m.FORNECEDOR, setor: '', material: m.MATERIAL, qtd: Number(m.QUANTIDADE) || 0, obs: m.OBSERVACAO }))
                ];
                renderRelatorio();
            } catch (e) {
                area.innerHTML = '<p class="p-6 text-center text-red-500 font-medium bg-white rounded-xl border border-red-100">Não foi possível carregar os dados: ' + esc(e.message) + '. Se você atualizou o script, publique uma nova versão da implantação.</p>';
            } finally { btn.disabled = false; }
        }

        function somarPor(lista, chave) {
            const m = {};
            lista.forEach(x => { const k = x[chave] || '-'; m[k] = (m[k] || 0) + x.qtd; });
            return Object.entries(m).sort((a, b) => b[1] - a[1]);
        }

        function blocoBarras(titulo, pares, cor) {
            const top = pares.slice(0, 5), max = top.length ? top[0][1] : 1;
            const linhas = top.length ? top.map(([nome, v]) =>
                '<div class="mb-3"><div class="flex justify-between text-sm mb-1"><span class="text-gray-700 truncate pr-2">' + esc(nome) + '</span><span class="font-semibold text-gray-800">' + v + '</span></div>' +
                '<div class="h-2 bg-gray-100 rounded-full"><div class="h-2 rounded-full ' + cor + '" style="width:' + Math.max(4, v / max * 100) + '%"></div></div></div>').join('')
                : '<p class="text-sm text-gray-400">Sem retiradas no período.</p>';
            return '<div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100"><h3 class="font-bold text-gray-800 text-sm mb-4">' + titulo + '</h3>' + linhas + '</div>';
        }

        function renderRelatorio() {
            if (!movimentosCache) return;
            const de = document.getElementById('rel-de').value, ate = document.getElementById('rel-ate').value;
            const tipo = document.getElementById('rel-tipo').value, setor = document.getElementById('rel-setor').value;
            const busca = document.getElementById('rel-busca').value.trim().toLowerCase();
            const dDe = de ? new Date(de + 'T00:00:00') : null, dAte = ate ? new Date(ate + 'T23:59:59') : null;

            relatorioAtual = movimentosCache.filter(m => {
                const d = new Date(m.data);
                if (dDe && !isNaN(d) && d < dDe) return false;
                if (dAte && !isNaN(d) && d > dAte) return false;
                if (tipo && m.tipo !== tipo) return false;
                if (setor && m.setor !== setor) return false;
                if (busca && !(String(m.material) + ' ' + String(m.pessoa)).toLowerCase().includes(busca)) return false;
                return true;
            }).sort((a, b) => new Date(b.data) - new Date(a.data));

            const ret = relatorioAtual.filter(m => m.tipo === 'Retirada'), ent = relatorioAtual.filter(m => m.tipo === 'Entrada');
            const soma = l => l.reduce((t, x) => t + x.qtd, 0);
            const baixos = baseEstoqueCache.filter(i => (Number(i.QUANTIDADE_ATUAL) || 0) <= ((i.ESTOQUE_MINIMO === '' || i.ESTOQUE_MINIMO == null) ? 5 : Number(i.ESTOQUE_MINIMO)));

            const card = (rotulo, valor, cor) => '<div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100"><p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">' + rotulo + '</p><p class="text-2xl font-bold ' + cor + '">' + valor + '</p></div>';
            const linhas = relatorioAtual.length ? relatorioAtual.map(m =>
                '<tr class="border-b border-gray-50 last:border-0"><td class="py-2.5 px-4 text-gray-500 whitespace-nowrap">' + esc(fmtData(m.data)) + '</td>' +
                '<td class="py-2.5 px-4 font-medium ' + (m.tipo === 'Retirada' ? 'text-red-500' : 'text-green-600') + '">' + m.tipo + '</td>' +
                '<td class="py-2.5 px-4 text-gray-800">' + esc(m.material) + '</td>' +
                '<td class="py-2.5 px-4 text-right font-semibold">' + m.qtd + '</td>' +
                '<td class="py-2.5 px-4 text-gray-600">' + esc(m.pessoa) + (m.setor ? ' <span class="text-gray-400">(' + esc(m.setor) + ')</span>' : '') + '</td>' +
                '<td class="py-2.5 px-4 text-gray-400">' + esc(m.id) + '</td></tr>').join('')
                : '<tr><td colspan="6" class="p-8 text-center text-gray-400">Nenhuma movimentação encontrada com esses filtros.</td></tr>';

            document.getElementById('rel-resultado').innerHTML =
                '<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">' +
                card('Movimentações', relatorioAtual.length, 'text-samunavy') + card('Itens retirados', soma(ret), 'text-red-500') +
                card('Itens recebidos', soma(ent), 'text-green-600') + card('Estoque baixo', baixos.length, 'text-amber-600') + '</div>' +
                '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">' + blocoBarras('Materiais mais retirados', somarPor(ret, 'material'), 'bg-red-400') + blocoBarras('Retiradas por setor', somarPor(ret, 'setor'), 'bg-samuazul') + '</div>' +
                '<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="text-xs text-gray-400 uppercase tracking-widest border-b border-gray-100 bg-gray-50/30">' +
                '<th class="py-3 px-4 font-semibold">Data</th><th class="py-3 px-4 font-semibold">Tipo</th><th class="py-3 px-4 font-semibold">Material</th><th class="py-3 px-4 font-semibold text-right">Qtd</th><th class="py-3 px-4 font-semibold">Solicitante / Origem</th><th class="py-3 px-4 font-semibold">Protocolo</th></tr></thead><tbody>' + linhas + '</tbody></table></div>';
        }

        function exportarCSV() {
            if (!relatorioAtual.length) { mostrarAviso('Gere um relatório com movimentações antes de exportar.'); return; }
            const c = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
            const linhas = [['Protocolo', 'Data', 'Tipo', 'Material', 'Quantidade', 'Solicitante/Origem', 'Setor', 'Observação'].map(c).join(';')]
                .concat(relatorioAtual.map(m => [m.id, fmtData(m.data), m.tipo, m.material, m.qtd, m.pessoa, m.setor, m.obs].map(c).join(';')));
            const blob = new Blob(['\ufeff' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'relatorio-estoque-' + new Date().toISOString().slice(0, 10) + '.csv';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function popularSetoresRelatorio() {
            const sel = document.getElementById('rel-setor');
            if (sel.options.length > 1) return;
            [...document.getElementById('ret-setor').options].filter(o => o.value).forEach(o => sel.add(new Option(o.value, o.value)));
        }

        function preencherHoraAtual() {
            const agora = new Date();
            agora.setMinutes(agora.getMinutes() - agora.getTimezoneOffset());
            const dataFormatada = agora.toISOString().slice(0, 16);
            document.getElementById('ret-data').value = dataFormatada;
            document.getElementById('ent-data').value = dataFormatada;
        }

        function navegar(alvo) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + alvo).classList.add('active');
            window.scrollTo(0, 0);
            if (alvo === 'relatorios') popularSetoresRelatorio();
            if (alvo === 'retirada' || alvo === 'entrada') {
                preencherHoraAtual();
            }
        }

        function sair() {
            document.getElementById('app-conteudo').classList.add('hidden');
            document.getElementById('tela-login').classList.remove('hidden');
            document.getElementById('tela-login').classList.add('active');
        }
    </script>
    <div id="toast" role="status" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-samunavy text-white text-sm font-medium px-5 py-3 rounded-lg shadow-lg z-50"></div>
</body>
</html>
